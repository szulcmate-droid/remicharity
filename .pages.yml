media:
  input: assets/media
  output: /assets/media
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif, svg, mp4, webm]

content:
  - name: bzpow
    label: BZPOW
    type: file
    path: content/bzpow.json
    format: json
    fields: &place_fields
      - { name: short, label: Krótka nazwa, type: string, required: true }
      - { name: full, label: Pełna nazwa, type: string, required: true }
      - { name: detail, label: Adres lub oddziały, type: string }
      - { name: eyebrow, label: Hasło, type: string }
      - { name: description, label: Opis, type: text, required: true }
      - { name: icon, label: Ikona, type: string }
      - { name: confirmed, label: Potrzeby potwierdzone przez placówkę, type: boolean }
      - name: gallery
        label: Galeria
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: kind
            label: Rodzaj materiału
            type: select
            required: true
            options:
              values:
                - { name: image, label: Zdjęcie }
                - { name: video, label: Film }
          - { name: image, label: Plik zdjęcia, type: image }
          - name: video
            label: Plik filmu
            type: file
            options:
              extensions: [mp4, webm]
          - name: externalUrl
            label: Adres HTTPS pliku
            type: string
            description: Wypełnij przy materiale zewnętrznym. Wybierz jedno źródło.
          - { name: youtubeId, label: Identyfikator filmu YouTube, type: string }
          - { name: poster, label: Miniatura filmu, type: image }
          - { name: alt, label: Opis alternatywny zdjęcia lub tytuł filmu, type: string, required: true }
          - { name: caption, label: Podpis pod materiałem, type: string }
          - { name: creditUrl, label: Adres strony źródłowej, type: string }
          - name: approved
            label: Dopuszczony do publikacji
            type: boolean
            default: false
            description: Zweryfikuj zgody przed dodaniem pliku do publicznego repozytorium.
  - name: szpital
    label: Szpital Dziecięcy
    type: file
    path: content/szpital.json
    format: json
    fields: *place_fields
  - name: hospicjum
    label: Hospicjum Pallmed Dom Sue Ryder
    type: file
    path: content/hospicjum.json
    format: json
    fields: *place_fields
  - name: needs
    label: Listy potrzeb
    type: file
    path: content/needs.json
    format: json
    list: true
    fields:
      - { name: id, label: Identyfikator potrzeby, type: string, required: true }
      - name: place
        label: Placówka
        type: select
        required: true
        options:
          values:
            - { name: bzpow, label: BZPOW }
            - { name: szpital, label: Szpital Dziecięcy }
            - { name: hospicjum, label: Hospicjum Pallmed Dom Sue Ryder }
      - { name: group, label: Grupa lub oddział, type: string, required: true }
      - { name: title, label: Nazwa potrzeby, type: string, required: true }
      - { name: description, label: Opis, type: text, required: true }
      - { name: icon, label: Ikona, type: string }
      - { name: priority, label: Priorytet, type: boolean }
      - { name: amount, label: Kwota, type: number }
      - name: status
        label: Status
        type: select
        required: true
        options:
          values:
            - { name: potrzebne, label: Zgłoszona potrzeba }
            - { name: do-uzgodnienia, label: Do uzgodnienia }
            - { name: zarezerwowane, label: Zadeklarowane }
            - { name: zrealizowane, label: Zrealizowane }
  - name: settings
    label: Kampania
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: campaignName, label: Nazwa kampanii, type: string }
      - { name: brandName, label: Nazwa inicjatywy, type: string }
      - { name: organizer, label: Organizator akcji, type: string }
      - { name: tagline, label: Hasło na pierwszym ekranie, type: string }
      - { name: intro, label: Opis na pierwszym ekranie, type: text }
      - { name: contactIntro, label: Opis w sekcji kontaktowej, type: text }
      - { name: supportTimeTitle, label: Hasło zachęcające do pierwszego kroku, type: string }
      - { name: supportTimeIntro, label: Opis pierwszego kroku, type: text }
      - { name: moneyboxIntro, label: Opis skarbonki firmowej, type: text }
      - { name: inKindSupportTitle, label: Nagłówek pomocy rzeczowej lub usługowej, type: string }
      - { name: inKindSupportIntro, label: Opis pomocy rzeczowej lub usługowej, type: text }
      - { name: companyContactName, label: Imię i nazwisko osoby kontaktowej dla firm w regulaminie, type: string }
      - { name: companyContactRole, label: Opis roli osoby kontaktowej dla firm w regulaminie, type: text }
      - { name: leaderBenefitTitle, label: Nagłówek wyróżnienia dla lidera, type: string }
      - { name: leaderBenefitIntro, label: Opis wyróżnienia dla lidera, type: text }
      - { name: contactEmail, label: E-mail organizatora, type: string }
      - { name: siteUrl, label: Publiczny adres witryny (HTTPS), type: string }
      - name: fundraiserUrl
        label: Adres wspólnej zbiórki
        type: string
        description: Wklej pełny adres zewnętrznej zbiórki. Przy pustym polu strona wyświetli „Zbiórka wkrótce”.
      - name: campaignDeadline
        label: Data i godzina zakończenia zbiórki
        type: string
        description: "Wpisz datę w formacie ISO 8601 z przesunięciem strefy czasowej, np. 2026-12-04T23:59:00+01:00. Pozostaw puste, aby ukryć licznik."
      - name: fundraiserWidgetCode
        label: Kod oficjalnego widgetu Zrzutka.pl
        type: text
        description: "Na stronie właściwej zbiórki wybierz …Więcej → Stwórz widget. Wybierz wariant z kwotą i celem, jeśli go ustalono. Wklej kod iframe. Jako adres wspólnej zbiórki wpisz kanoniczny adres z jej ID, zgodnym z ID w kodzie widgetu. Przy zmianie zbiórki wymień oba pola. Skrypty nie są wykonywane."
      - name: fundraiserWidgetEnabled
        label: Włącz oficjalny widget bieżącej zbiórki
        type: boolean
        description: "Włącz po sprawdzeniu, że kod widgetu dotyczy zbiórki z pola adresu. Dane organizatora są określane na Zrzutka.pl. Wyłączenie widgetu pozostawia odnośnik do aktualnego wyniku."
      - { name: amountRaised, label: Zebrana kwota (PLN), type: number }
      - { name: targetAmount, label: Cel zbiórki (PLN), type: number }
      - name: operatorName
        label: Dane osoby prowadzącej zbiórkę na Zrzutka.pl
        type: string
        description: Wpisz imię i nazwisko w dopełniaczu (np. Mateusza Szulca). Ta informacja pojawia się w regulaminie i FAQ.
      - { name: allocationText, label: Zasady podziału środków, type: text }
  - name: partners
    label: Partnerzy
    type: file
    path: content/partners.json
    format: json
    list: true
    fields:
      - { name: name, label: Nazwa firmy, type: string, required: true }
      - name: logo
        label: Logo firmy
        type: image
        description: Wybierz JPG, PNG, WebP lub AVIF. Oficjalny znak Remivision jest dostępny jako SVG.
      - name: website
        label: Adres strony internetowej
        type: string
        required: true
        description: Wpisz pełny adres strony firmy, zaczynając od https:// lub http://.
      - { name: description, label: Krótki opis, type: text }
